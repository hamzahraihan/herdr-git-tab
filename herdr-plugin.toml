id = "herdr-git-tab"
name = "Git Tab"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Keyboard-driven git + GitHub TUI: history, graph, branches, PRs, issues, status."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["pnpm", "install"]

[[build]]
command = ["pnpm", "approve-builds", "esbuild"]

[[build]]
command = ["pnpm", "build"]

[[build]]
command = ["node", "dist/bin/setup-keys.js", "--auto"]

# Automatically ensure keybinding is registered when Herdr starts.
[[startup]]
command = ["node", "dist/bin/setup-keys.js", "--auto"]

# Right-click "Open Git Tab" on a Herdr workspace.
[[actions]]
id = "open-git-tab"
title = "Open Git Tab"
contexts = ["workspace"]
command = ["node", "dist/bin/open-tab.js"]


# Tab command the user can launch from a workspace. Runs through a wrapper
# that binds to the workspace's live shell cwd before exec'ing the TUI (the
# tab keeps following it automatically from there).
# Uses `bun` because OpenTUI requires Node >= 26.4 or Bun >= 1.3;
# plain `node` on older runtimes fails with "native FFI is not available".
[[panes]]
id = "git-tab"
title = "Git"
placement = "tab"
command = ["bun", "dist/bin/launch-tab.js"]
